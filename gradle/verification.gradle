def compatibilityArtifacts = tasks.register('prepareCompatibilityArtifacts', Sync) {
    into layout.buildDirectory.dir('compatibility-artifacts')
    from(configurations.primaryCreate) {
        rename { 'create.jar' }
    }
    from(configurations.primarySable) {
        rename { 'sable-primary.jar' }
    }
    from(configurations.legacySable) {
        rename { 'sable-legacy.jar' }
    }
    from(configurations.primaryAeronautics) { into 'aeronautics-primary' }
    from(configurations.primarySimulated) { into 'aeronautics-primary' }
    from(configurations.primaryOffroad) { into 'aeronautics-primary' }
    from(configurations.legacyAeronautics) {
        rename { 'aeronautics-legacy.jar' }
    }
}
compatibilitySymbols.configure {
    dependsOn compatibilityArtifacts
    args rootProject.projectDir.absolutePath
}

