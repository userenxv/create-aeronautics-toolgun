sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

def verificationJavaExec = { String taskName, String taskDescription, String mainClassName ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = taskDescription
        dependsOn tasks.named('verificationClasses')
        classpath = sourceSets.verification.runtimeClasspath
        mainClass = mainClassName
    }
}

tasks.register('inspectSavedBlueprint', JavaExec) {
    group = 'verification'
    description = 'Inspect one saved blueprint using the project runtime classpath.'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.enxv.aeronauticsstructuretool.DebugInspectSavedBlueprint'
    if (project.hasProperty('inspectFile')) {
        args project.property('inspectFile')
    }
    if (project.hasProperty('inspectValidateOnly')) {
        args '--validate-only'
    }
}

tasks.register('verifySourceHygiene') {
    group = 'verification'
    description = 'Reject silent catches, hard-coded disabled branches, and console diagnostics in runtime code.'

    doLast {
        def violations = []
        fileTree('src/main/java').matching { include '**/*.java' }.each { sourceFile ->
            def source = sourceFile.getText('UTF-8')
            if (source =~ /(?s)catch\s*\([^)]*\)\s*\{\s*\}/) {
                violations.add(sourceFile.toString() + ': empty catch block')
            }
            if (source =~ /\bif\s*\(\s*(true|false)\s*\)/) {
                violations.add(sourceFile.toString() + ': hard-coded conditional branch')
            }
            if (source.contains('printStackTrace(')
                    || source.contains('System.out.')
                    || source.contains('System.err.')) {
                violations.add(sourceFile.toString() + ': direct console diagnostic')
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException('Source hygiene violations:\n' + violations.join('\n'))
        }
    }
}

tasks.register('compileLegacySableJava', JavaCompile) {
    group = 'verification'
    description = 'Compile all runtime sources against the supported Sable 1.1.3 API layout.'
    dependsOn tasks.named('extractLegacyNestedDependencies')
    source = sourceSets.main.java
    def primarySableClasspath = files(configurations.primarySable) + project.ext.primaryNestedJars.filter {
        it.name.startsWith('sable-companion-common-')
    }
    classpath = (sourceSets.main.compileClasspath - primarySableClasspath
            + configurations.legacySable + project.ext.legacyNestedJars)
    destinationDirectory = layout.buildDirectory.dir('classes/java/legacySable')
    options.encoding = 'UTF-8'
    options.release = 21
    options.incremental = false
}

